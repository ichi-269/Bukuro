<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profileUser.username} + ' のフォロー中 - Bukuro'">フォロー中 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="mb-4">
                <a th:href="@{'/users/' + ${profileUser.username}}"
                   class="text-decoration-none text-muted small">← <span th:text="${profileUser.username}"></span> のページへ</a>
                <h2 class="fw-bold mt-2 mb-0">フォロー中</h2>
                <p class="text-muted small mb-0" th:text="${profileUser.username} + ' さんがフォローしているユーザー'"></p>
            </div>

            <div th:if="${#lists.isEmpty(users)}" class="text-center text-muted py-5">
                <p>まだフォロー中のユーザーがいません。</p>
            </div>

            <div th:unless="${#lists.isEmpty(users)}">
                <div th:each="user : ${users}" class="d-flex align-items-center py-3 border-bottom">
                    <a th:href="@{'/users/' + ${user.username}}"
                       class="text-decoration-none text-dark fw-semibold"
                       th:text="${user.username}"></a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
