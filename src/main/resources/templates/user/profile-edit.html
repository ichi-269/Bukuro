<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール編集 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="fw-bold mb-4">プロフィール編集</h2>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/profile/edit}" th:object="${profileEditForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">ユーザー名</label>
                    <input type="text" id="username" class="form-control"
                           th:field="*{username}"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="bio" class="form-label fw-bold">自己紹介</label>
                    <textarea id="bio" class="form-control" rows="4"
                              th:field="*{bio}"
                              th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid' : ''"
                              placeholder="自己紹介を入力してください（任意）"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bio')}"
                         th:errors="*{bio}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark">保存する</button>
                    <a th:href="@{/mypage}" class="btn btn-outline-secondary">キャンセル</a>
                </div>
            </form>

        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
