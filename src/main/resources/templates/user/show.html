<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profileUser.username} + ' - Bukuro'">ユーザーページ - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- プロフィールカード -->
            <div class="card mb-5">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h2 class="fw-bold mb-1" th:text="${profileUser.username}"></h2>
                            <p class="text-muted small mb-2"
                               th:text="'登録: ' + ${#temporals.format(profileUser.createdAt, 'yyyy年M月')}"></p>
                            <p th:if="${profileUser.bio != null and !#strings.isEmpty(profileUser.bio)}"
                               class="mb-0" th:text="${profileUser.bio}"></p>
                            <div class="mt-2 d-flex gap-3">
                                <a th:href="@{'/users/' + ${profileUser.username} + '/followers'}"
                                   class="text-decoration-none text-muted small">
                                    フォロワー <strong th:text="${followerCount}"></strong>
                                </a>
                                <a th:href="@{'/users/' + ${profileUser.username} + '/following'}"
                                   class="text-decoration-none text-muted small">
                                    フォロー中 <strong th:text="${followingCount}"></strong>
                                </a>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold fs-4" th:text="${postCount}"></div>
                            <div class="text-muted small">公開記事</div>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <div th:if="${isOwnPage}">
                            <a th:href="@{/shelf}" class="btn btn-outline-dark btn-sm">本棚を見る</a>
                        </div>
                        <div th:if="${!isOwnPage}" sec:authorize="isAuthenticated()">
                            <form th:if="${!isFollowing}"
                                  th:action="@{'/users/' + ${profileUser.username} + '/follow'}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-dark btn-sm">フォローする</button>
                            </form>
                            <form th:if="${isFollowing}"
                                  th:action="@{'/users/' + ${profileUser.username} + '/unfollow'}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-secondary btn-sm">フォロー中</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 公開記事一覧 -->
            <h4 class="fw-bold mb-3">公開記事</h4>

            <div th:if="${#lists.isEmpty(posts)}" class="text-center text-muted py-5">
                <p>まだ公開記事はありません。</p>
            </div>

            <div th:each="post : ${posts}" class="card mb-3">
                <div class="card-body">
                    <div class="row g-3 align-items-center">
                        <!-- 書影 -->
                        <div class="col-auto">
                            <img th:if="${post.book.coverUrl != null}"
                                 th:src="${post.book.coverUrl}"
                                 alt="書影" class="img-thumbnail"
                                 style="width: 50px; height: auto;">
                            <div th:if="${post.book.coverUrl == null}"
                                 class="bg-light d-flex align-items-center justify-content-center"
                                 style="width: 50px; height: 70px;">
                                <span class="text-muted" style="font-size: 0.6rem;">No Cover</span>
                            </div>
                        </div>
                        <!-- 記事情報 -->
                        <div class="col">
                            <a th:href="@{'/posts/' + ${post.id}}"
                               class="text-decoration-none text-dark">
                                <h6 class="fw-bold mb-1" th:text="${post.title}"></h6>
                            </a>
                            <p class="text-muted small mb-0" th:text="${post.book.title}"></p>
                        </div>
                        <!-- メタ情報 -->
                        <div class="col-auto text-end">
                            <div class="text-muted small">
                                &#128077; <span th:text="${post.goodCount}"></span>
                            </div>
                            <div class="text-muted small"
                                 th:text="${#temporals.format(post.createdAt, 'yyyy/M/d')}"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
