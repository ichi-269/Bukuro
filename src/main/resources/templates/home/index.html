<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bukuro - 読書ブログ＆本棚サービス</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main>
    <!-- ヒーロー（未認証） -->
    <section sec:authorize="isAnonymous()" class="hero-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5 text-center">
                    <p class="hero-eyebrow">Reading Journal</p>
                    <h1 class="hero-title">Bukuro</h1>
                    <p class="hero-body">
                        日々の読書の記録
                    </p>
                    <div class="hero-cta">
                        <a th:href="@{/register}" class="btn btn-dark hero-btn-primary">無料で始める</a>
                        <a th:href="@{/login}" class="hero-link-secondary">ログイン</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ログイン済みフィード -->
    <div sec:authorize="isAuthenticated()" class="container mt-5">
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 text-center">
                <a th:href="@{/books/search}" class="btn btn-dark me-2">本を登録する</a>
                <a th:href="@{/shelf}" class="btn btn-outline-secondary">本棚を見る</a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">

                <!-- フォロイーがいる場合のみタブを表示 -->
                <div th:if="${hasFollowees}">
                    <ul class="nav nav-tabs mb-3">
                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link"
                               th:classappend="${feedType == 'following'} ? 'active' : ''">フォロー中</a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/?feed=recommended}" class="nav-link"
                               th:classappend="${feedType == 'recommended'} ? 'active' : ''">おすすめ</a>
                        </li>
                    </ul>
                </div>
                <!-- フォロイーがいない場合は見出しのみ -->
                <div th:unless="${hasFollowees}">
                    <h4 class="fw-bold mb-3">おすすめ記事</h4>
                </div>

                <div th:if="${#lists.isEmpty(feedPosts)}" class="text-center text-muted py-5">
                    <div th:if="${feedType == 'following'}">
                        <p>フォロー中のユーザーがまだ記事を書いていません。</p>
                        <p class="small">
                            <a th:href="@{/books/search}">本を登録して記事を書く</a>か、
                            気になるユーザーをフォローしてみましょう。
                        </p>
                    </div>
                    <p th:if="${feedType == 'recommended'}">
                        まだ公開記事がありません。<br>
                        <a th:href="@{/books/search}">最初の1冊を登録して記事を書いてみましょう。</a>
                    </p>
                </div>

                <div th:each="post : ${feedPosts}" class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3 align-items-center">
                            <!-- 書影 -->
                            <div class="col-auto">
                                <img th:if="${post.book.coverUrl != null}"
                                     th:src="${post.book.coverUrl}"
                                     alt="書影" class="img-thumbnail"
                                     style="width: 50px; height: auto;">
                                <div th:if="${post.book.coverUrl == null}"
                                     class="bg-light d-flex align-items-center justify-content-center"
                                     style="width: 50px; height: 70px;">
                                    <span class="text-muted" style="font-size: 0.6rem;">No Cover</span>
                                </div>
                            </div>
                            <!-- 記事情報 -->
                            <div class="col">
                                <a th:href="@{'/posts/' + ${post.id}}"
                                   class="text-decoration-none text-dark">
                                    <h6 class="fw-bold mb-1" th:text="${post.title}"></h6>
                                </a>
                                <p class="text-muted small mb-0">
                                    <a th:href="@{'/users/' + ${post.user.username}}"
                                       class="text-decoration-none text-muted"
                                       th:text="${post.user.username}"></a>
                                    &middot;
                                    <span th:text="${post.book.title}"></span>
                                </p>
                            </div>
                            <!-- メタ情報 -->
                            <div class="col-auto text-end">
                                <div class="text-muted small">
                                    &#128077; <span th:text="${post.goodCount}"></span>
                                </div>
                                <div class="text-muted small"
                                     th:text="${#temporals.format(post.createdAt, 'yyyy/M/d')}"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
