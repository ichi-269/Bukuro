<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-1 fw-bold">書名検索結果</h2>
            <p class="text-muted mb-4">
                「<span th:text="${keyword}"></span>」の検索結果
                <span th:if="${#lists.isEmpty(candidates)}" class="ms-2 text-secondary">（0件）</span>
                <span th:unless="${#lists.isEmpty(candidates)}" class="ms-2 text-secondary"
                      th:text="|（${#lists.size(candidates)}件）|"></span>
            </p>

            <div th:if="${#lists.isEmpty(candidates)}" class="alert alert-info">
                該当する図書が見つかりませんでした。別のキーワードで検索してください。
            </div>

            <div th:unless="${#lists.isEmpty(candidates)}">
                <div th:each="book : ${candidates}" class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div class="flex-grow-1">
                                <h6 class="fw-bold mb-1" th:text="${book.title}"></h6>
                                <div th:if="${book.author}" class="text-muted small mb-1" th:text="${book.author}"></div>
                                <div th:if="${book.publisher}" class="text-muted small mb-1"
                                     th:text="${book.publisher}"></div>
                                <div class="text-muted small font-monospace"
                                     th:text="|ISBN: ${book.isbn}|"></div>
                            </div>
                            <form th:action="@{/books/search/confirm}" method="post" class="flex-shrink-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="isbn" th:value="${book.isbn}">
                                <input type="hidden" name="title" th:value="${book.title}">
                                <input type="hidden" name="author" th:value="${book.author}">
                                <input type="hidden" name="publisher" th:value="${book.publisher}">
                                <button type="submit" class="btn btn-outline-dark btn-sm">この本を選択</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <a th:href="@{/books/search}" class="btn btn-link ps-0">← 検索に戻る</a>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
