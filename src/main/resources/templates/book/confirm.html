<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書誌情報の確認 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h2 class="mb-4 fw-bold">書誌情報の確認</h2>
            <p class="text-muted mb-4">取得した書誌情報を確認してください。この情報は変更できません。</p>

            <div class="card">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-auto">
                            <img th:if="${book.coverUrl != null}"
                                 th:src="${book.coverUrl}"
                                 alt="書影" class="img-thumbnail"
                                 style="width: 100px; height: auto;">
                            <div th:if="${book.coverUrl == null}"
                                 class="bg-light d-flex align-items-center justify-content-center"
                                 style="width: 100px; height: 140px;">
                                <span class="text-muted small">No Cover</span>
                            </div>
                        </div>
                        <div class="col">
                            <h5 class="fw-bold mb-1" th:text="${book.title}"></h5>
                            <p class="text-muted mb-1" th:text="${book.author}"></p>
                            <p class="text-muted small mb-1" th:text="${book.publisher}"></p>
                            <p class="text-muted small font-monospace" th:text="'ISBN: ' + ${book.isbn}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <form th:action="@{/books/add}" method="post" class="flex-grow-1">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="isbn" th:value="${book.isbn}">
                    <button type="submit" class="btn btn-dark btn-lg w-100">
                        本棚に追加する
                    </button>
                </form>
                <a th:href="@{/books/search}" class="btn btn-outline-secondary btn-lg">
                    別の本を検索
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
