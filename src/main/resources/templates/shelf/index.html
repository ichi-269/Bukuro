<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本棚 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">本棚</h2>
        <a th:href="@{/books/search}" class="btn btn-dark">本を追加する</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- タブナビゲーション -->
    <ul class="nav nav-tabs mb-4" id="shelfTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="want-tab" data-bs-toggle="tab"
                    data-bs-target="#want" type="button" role="tab">
                読みたい
                <span class="badge bg-secondary ms-1"
                      th:text="${#lists.size(wantToRead)}"></span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="reading-tab" data-bs-toggle="tab"
                    data-bs-target="#reading" type="button" role="tab">
                読書中
                <span class="badge bg-secondary ms-1"
                      th:text="${#lists.size(reading)}"></span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="done-tab" data-bs-toggle="tab"
                    data-bs-target="#done" type="button" role="tab">
                読了
                <span class="badge bg-secondary ms-1"
                      th:text="${#lists.size(done)}"></span>
            </button>
        </li>
    </ul>

    <!-- タブコンテンツ -->
    <div class="tab-content" id="shelfTabsContent">

        <!-- 読みたい -->
        <div class="tab-pane fade show active" id="want" role="tabpanel">
            <div th:if="${#lists.isEmpty(wantToRead)}" class="text-center text-muted py-5">
                <p>読みたい本はまだありません。</p>
                <a th:href="@{/books/search}" class="btn btn-outline-dark">本を追加する</a>
            </div>
            <div th:each="record : ${wantToRead}">
                <div th:replace="~{shelf/index :: bookCard(record=${record})}"></div>
            </div>
        </div>

        <!-- 読書中 -->
        <div class="tab-pane fade" id="reading" role="tabpanel">
            <div th:if="${#lists.isEmpty(reading)}" class="text-center text-muted py-5">
                <p>読書中の本はありません。</p>
            </div>
            <div th:each="record : ${reading}">
                <div th:replace="~{shelf/index :: bookCard(record=${record})}"></div>
            </div>
        </div>

        <!-- 読了 -->
        <div class="tab-pane fade" id="done" role="tabpanel">
            <div th:if="${#lists.isEmpty(done)}" class="text-center text-muted py-5">
                <p>読了した本はありません。</p>
            </div>
            <div th:each="record : ${done}">
                <div th:replace="~{shelf/index :: bookCard(record=${record})}"></div>
            </div>
        </div>

    </div>
</main>

<!-- 書籍カードフラグメント -->
<th:block th:fragment="bookCard(record)" th:if="${record != null}">
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <!-- 書影 -->
                <div class="col-auto">
                    <img th:if="${record.book.coverUrl != null}"
                         th:src="${record.book.coverUrl}"
                         alt="書影" class="img-thumbnail"
                         style="width: 70px; height: auto;">
                    <div th:if="${record.book.coverUrl == null}"
                         class="bg-light d-flex align-items-center justify-content-center"
                         style="width: 70px; height: 100px;">
                        <span class="text-muted" style="font-size: 0.65rem;">No Cover</span>
                    </div>
                </div>

                <!-- 書誌情報 -->
                <div class="col">
                    <h6 class="fw-bold mb-1">
                        <a th:if="${postIdByBookId.containsKey(record.book.id)}"
                           th:href="@{'/posts/' + ${postIdByBookId.get(record.book.id)}}"
                           class="text-decoration-none text-dark"
                           th:text="${record.book.title}"></a>
                        <span th:unless="${postIdByBookId.containsKey(record.book.id)}"
                              th:text="${record.book.title}"></span>
                    </h6>
                    <p class="text-muted small mb-1" th:text="${record.book.author}"></p>
                    <p class="text-muted small mb-0" th:text="${record.book.publisher}"></p>
                </div>

                <!-- 操作エリア -->
                <div class="col-auto d-flex gap-2 align-items-center flex-wrap justify-content-end">

                    <!-- 記事を書く / 編集する -->
                    <a th:if="${!postIdByBookId.containsKey(record.book.id)}"
                       th:href="@{'/posts/new?bookId=' + ${record.book.id}}"
                       class="btn btn-outline-dark btn-sm">記事を書く</a>
                    <a th:if="${postIdByBookId.containsKey(record.book.id)}"
                       th:href="@{'/posts/' + ${postIdByBookId.get(record.book.id)} + '/edit'}"
                       class="btn btn-outline-secondary btn-sm">編集する</a>

                    <!-- ステータス変更フォーム -->
                    <form th:action="@{'/shelf/' + ${record.id} + '/status'}" method="post"
                          class="d-flex gap-2 align-items-center">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="status" class="form-select form-select-sm" style="width: auto;">
                            <option value="WANT_TO_READ"
                                    th:selected="${record.status.name() == 'WANT_TO_READ'}">読みたい</option>
                            <option value="READING"
                                    th:selected="${record.status.name() == 'READING'}">読書中</option>
                            <option value="DONE"
                                    th:selected="${record.status.name() == 'DONE'}">読了</option>
                        </select>
                        <button type="submit" class="btn btn-outline-secondary btn-sm">更新</button>
                    </form>

                    <!-- 削除フォーム -->
                    <form th:action="@{'/shelf/' + ${record.id} + '/delete'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-danger btn-sm"
                                onclick="return confirm('本棚から削除しますか？')">削除</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</th:block>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
