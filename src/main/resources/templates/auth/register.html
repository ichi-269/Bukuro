<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4 fw-bold">新規登録</h2>

            <form th:action="@{/register}" th:object="${registerForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="email" class="form-label">メールアドレス</label>
                    <input type="email" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           id="email" th:field="*{email}" placeholder="example@mail.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">ユーザー名</label>
                    <input type="text" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                           id="username" th:field="*{username}" placeholder="3〜50文字">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">パスワード</label>
                    <input type="password" class="form-control"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           id="password" th:field="*{password}" placeholder="8文字以上">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>

                <div class="mb-4">
                    <label for="passwordConfirm" class="form-label">パスワード（確認）</label>
                    <input type="password" class="form-control"
                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid'"
                           id="passwordConfirm" th:field="*{passwordConfirm}">
                    <div class="invalid-feedback" th:errors="*{passwordConfirm}"></div>
                </div>

                <button type="submit" class="btn btn-dark w-100">登録する</button>
            </form>

            <p class="mt-3 text-center text-muted">
                すでにアカウントをお持ちの方は
                <a th:href="@{/login}">こちら</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
