<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4 fw-bold">ログイン</h2>

            <div th:if="${param.registered}" class="alert alert-success" role="alert">
                登録が完了しました。ログインしてください。
            </div>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                メールアドレスまたはパスワードが正しくありません。
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="username" class="form-label">メールアドレス</label>
                    <input type="email" class="form-control" id="username"
                           name="username" placeholder="example@mail.com" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">パスワード</label>
                    <input type="password" class="form-control" id="password"
                           name="password" required>
                </div>

                <button type="submit" class="btn btn-dark w-100">ログイン</button>
            </form>

            <p class="mt-3 text-center text-muted">
                アカウントをお持ちでない方は
                <a th:href="@{/register}">新規登録</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
