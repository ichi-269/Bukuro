<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - Bukuro'">記事詳細 - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- 書籍情報 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-center">
                        <img th:if="${post.book.coverUrl != null}"
                             th:src="${post.book.coverUrl}"
                             alt="書影" class="img-thumbnail" style="width: 60px; height: auto;">
                        <div th:if="${post.book.coverUrl == null}"
                             class="bg-light d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width: 60px; height: 85px;">
                            <span class="text-muted" style="font-size: 0.65rem;">No Cover</span>
                        </div>
                        <div>
                            <div class="fw-bold" th:text="${post.book.title}"></div>
                            <div class="text-muted small" th:text="${post.book.author}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 記事ヘッダー -->
            <div class="mb-3 d-flex justify-content-between align-items-start">
                <div>
                    <h1 class="fw-bold mb-2" th:text="${post.title}"></h1>
                    <div class="text-muted small">
                        <span th:text="${post.user.username}"></span> ·
                        <span th:text="${#temporals.format(post.createdAt, 'yyyy年M月d日')}"></span>
                        <span th:if="${post.updatedAt != post.createdAt}"
                              th:text="|（${#temporals.format(post.updatedAt, 'M月d日更新')}）|"></span>
                    </div>
                </div>
                <span th:if="${post.public}" class="badge bg-dark">公開</span>
                <span th:if="${!post.public}" class="badge bg-secondary">非公開</span>
            </div>

            <!-- 本文 -->
            <div class="card mb-4">
                <div class="card-body">
                    <p class="mb-0" style="white-space: pre-line;" th:text="${post.body}"></p>
                </div>
            </div>

            <!-- グッド -->
            <div class="mb-4 d-flex align-items-center gap-3">
                <!-- 未ログイン: 静的表示 -->
                <div sec:authorize="isAnonymous()" class="text-muted small">
                    &#128077; <span th:text="${post.goodCount}"></span>
                </div>
                <!-- ログイン済み + 未グッド: グッドするボタン -->
                <div sec:authorize="isAuthenticated()" th:if="${!hasGooded}">
                    <form th:action="@{'/posts/' + ${post.id} + '/good'}" method="post"
                          class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline-dark btn-sm">
                            &#128077; グッドする
                        </button>
                    </form>
                    <span class="text-muted small ms-1" th:text="${post.goodCount}"></span>
                </div>
                <!-- ログイン済み + グッド済み: グッド取り消しボタン -->
                <div sec:authorize="isAuthenticated()" th:if="${hasGooded}">
                    <form th:action="@{'/posts/' + ${post.id} + '/ungood'}" method="post"
                          class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-dark btn-sm">
                            &#128077; グッド済み
                        </button>
                    </form>
                    <span class="text-muted small ms-1" th:text="${post.goodCount}"></span>
                </div>
            </div>

            <!-- フラッシュメッセージ -->
            <div th:if="${warningMessage}" class="alert alert-warning py-2 mb-3"
                 th:text="${warningMessage}"></div>

            <!-- 操作ボタン（本人のみ） -->
            <div th:if="${isOwner}" class="d-flex gap-2 mb-4">
                <a th:href="@{'/posts/' + ${post.id} + '/edit'}"
                   class="btn btn-outline-secondary">編集する</a>
                <form th:action="@{'/posts/' + ${post.id} + '/delete'}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-danger"
                            onclick="return confirm('この記事を削除しますか？')">削除する</button>
                </form>
            </div>

            <a th:href="@{/shelf}" class="btn btn-link ps-0">← 本棚に戻る</a>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
