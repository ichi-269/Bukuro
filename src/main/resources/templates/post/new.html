<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事を書く - Bukuro</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="fw-bold mb-4">記事を書く</h2>

            <!-- 書籍情報 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex gap-3 align-items-center">
                        <img th:if="${book.coverUrl != null}"
                             th:src="${book.coverUrl}"
                             alt="書影" class="img-thumbnail" style="width: 60px; height: auto;">
                        <div th:if="${book.coverUrl == null}"
                             class="bg-light d-flex align-items-center justify-content-center flex-shrink-0"
                             style="width: 60px; height: 85px;">
                            <span class="text-muted" style="font-size: 0.65rem;">No Cover</span>
                        </div>
                        <div>
                            <div class="fw-bold" th:text="${book.title}"></div>
                            <div class="text-muted small" th:text="${book.author}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 記事フォーム -->
            <form th:action="@{/posts}" method="post" th:object="${postForm}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="bookId" th:value="${book.id}">

                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">タイトル <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title"
                           th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                           maxlength="255" placeholder="記事のタイトルを入力してください">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="body" class="form-label fw-semibold">本文 <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="body"
                              th:field="*{body}"
                              th:classappend="${#fields.hasErrors('body')} ? 'is-invalid'"
                              rows="12" placeholder="読書の感想や考えを書いてください"></textarea>
                    <div class="invalid-feedback" th:errors="*{body}"></div>
                </div>

                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="isPublic"
                               th:field="*{isPublic}">
                        <label class="form-check-label" for="isPublic">公開する</label>
                    </div>
                    <div class="form-text">チェックを外すと非公開（草稿）として保存されます</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-dark btn-lg">投稿する</button>
                    <a th:href="@{/shelf}" class="btn btn-outline-secondary btn-lg">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{layout/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
