name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: bukuro-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bukuro_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build & test (backend + frontend build via frontend-maven-plugin)
        run: mvn -B verify
        env:
          DB_URL: jdbc:mysql://localhost:3306/bukuro_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend unit tests (Vitest)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # EC2はarm64(Graviton)想定のため、amd64ランナー上でQEMUを使いarm64イメージをビルドする
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ vars.ECR_REPOSITORY }}:latest
            ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Stage deploy bundle
        run: |
          mkdir -p bundle
          cp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/deploy.sh bundle/
          cp src/main/resources/db/schema.sql bundle/

      - name: Upload deploy bundle to S3
        run: aws s3 sync bundle/ "s3://${{ vars.S3_BUCKET }}/deploy/" --delete

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start instance if stopped, wait for SSM online
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          STATE=$(aws ec2 describe-instances \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Instance state: $STATE"

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$EC2_INSTANCE_ID"
            aws ec2 wait instance-running --instance-ids "$EC2_INSTANCE_ID"
          fi

          STATUS="Offline"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "Offline")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online"
              break
            fi
            echo "Waiting for SSM agent to come online... (${i}/30)"
            sleep 10
          done

          if [ "$STATUS" != "Online" ]; then
            echo "SSM agent did not come online in time" >&2
            exit 1
          fi

      - name: Deploy via SSM Send-Command
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${S3_BUCKET}/deploy/deploy.sh /opt/bukuro/deploy.sh",
              "chmod +x /opt/bukuro/deploy.sh",
              "AWS_REGION=${AWS_REGION_VAR} S3_BUCKET=${S3_BUCKET} ECR_REPOSITORY=${ECR_REPOSITORY} /opt/bukuro/deploy.sh"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "bukuro deploy ${GITHUB_SHA}" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deploy result
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' --output text)
          echo "Deploy command status: $STATUS"

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---" >&2
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
              --query 'StandardErrorContent' --output text >&2
            exit 1
          fi
